name: Build All Formats and Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      build_args:
        description: 'Args for build.py'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        config: [
          {name: "normal-liga", args: "--normal --liga"},
          {name: "normal-no-liga", args: "--normal --no-liga"},
          {name: "liga", args: "--liga"},
          {name: "no-liga", args: "--no-liga"}
        ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: './requirements.txt'
      - run: pip install -r requirements.txt
      - name: Build fonts
        run: |
          python build.py \
            --ttf-only \
            --nerd-font \
            --cn \
            --feat cv01,cv03,cv07,cv40,cv61,ss03,ss05,ss07,ss08,ss11 \
            ${{ matrix.config.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: fonts-${{ matrix.config.name }}
          path: dist/*.ttf

  create-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 关键权限
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          pattern: fonts-*  # 匹配上传的 Artifacts 名称
          merge-multiple: true

      - name: Create Release
        run: |
          # 统一文件路径
          mkdir -p release_files
          find release -name "*.ttf" -exec cp {} release_files/ \;
          
          # 创建 Release（标签用提交哈希避免重复）
          gh release create \
            "build-$(git rev-parse --short HEAD)" \
            release_files/*.ttf \
            --title "Maple Mono Build ($(date +%F))" \
            --notes "Automated build"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
