name: Build All Formats and Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      build_args:
        description: 'Args for build.py'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        config: [
          {name: "normal-liga", args: "--normal --liga"},
         
          {name: "liga", args: "--liga"},
          
        ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: './requirements.txt'
      - run: pip install -r requirements.txt
      - name: Build fonts
        run: |
          
          python build.py \
            --outputdir ./resources \
            --ttf-only \
            --nerd-font \
            --cn \
            --feat cv01,cv03,cv07,cv40,cv61,ss03,ss05,ss07,ss08,ss11 \
            ${{ matrix.config.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: fonts-${{ matrix.config.name }}
          path: resources/*.ttf

  
